<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CV Banong Farms – Motion Graphic</title>
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf"); font-weight: 300 700; }
  @font-face { font-family: "Patrick Hand"; src: url("fonts/PatrickHand.ttf"); }
  @font-face { font-family: "Caveat"; src: url("fonts/Caveat.ttf"); font-weight: 400 700; }
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; max-width: 1920px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script src="illus.js"></script>
<script src="scenes.js"></script>
<script>
  ctx = document.getElementById('c').getContext('2d');
  window.READY = (async () => {
    await Promise.all([
      loadImage('logo', 'assets/logo.png'),
      loadImage('mascot', 'assets/mascot.png'),
      loadImage('hero', 'assets/site_desktop_hero.png'),
      loadImage('catalog', 'assets/site_desktop_catalog.png'),
      loadImage('mhero', 'assets/site_mobile_hero.png'),
      document.fonts.load('700 40px "Fredoka"'), document.fonts.load('500 40px "Fredoka"'),
      document.fonts.load('600 40px "Fredoka"'), document.fonts.load('40px "Patrick Hand"'),
    ]);
    await document.fonts.ready;
    makeTextures();
    return true;
  })();
  window.renderFrame = (t) => { render(t); };
  window.grabFrame = (t, q) => { render(t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.93); };

  // Mode pratinjau: buka index.html?play  (putar realtime) atau ?t=12.5 (satu frame)
  const qs = new URLSearchParams(location.search);
  window.READY.then(() => {
    if (qs.has('t')) render(parseFloat(qs.get('t')));
    else if (qs.has('play')) {
      const t0 = performance.now() - (parseFloat(qs.get('play')) || 0) * 1000;
      const loop = () => { render(((performance.now() - t0) / 1000) % 60); requestAnimationFrame(loop); };
      loop();
    } else render(2.8);
  });
</script>
</body>
</html>
